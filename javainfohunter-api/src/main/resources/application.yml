server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: javainfohunter-api

  # AI configuration (development placeholder)
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      enabled: false

  # Auto-configuration exclusions
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration

  # Database configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:javainfohunter}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: ${API_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis configuration (optional)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      jedis:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
      timeout: 2000ms

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false
    defaults:
      enabled: true

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: true

# Knife4j configuration
knife4j:
  enable: true
  setting:
    language: en
  production: false

# Logging configuration
logging:
  level:
    com.ron.javainfohunter: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# JavaInfoHunter API configuration
javainfohunter:
  startup:
    validation:
      enabled: ${STARTUP_VALIDATION_ENABLED:true}
      required-properties:
        - spring.datasource.username
        - spring.datasource.password
        - javainfohunter.security.jwt.secret
      numeric-ranges:
        - "spring.datasource.hikari.maximum-pool-size|1|64"
        - "spring.datasource.hikari.minimum-idle|0|32"
        - "spring.datasource.hikari.connection-timeout|1000|120000"
        - "spring.datasource.hikari.idle-timeout|10000|1800000"
        - "spring.datasource.hikari.max-lifetime|30000|7200000"
      compare-rules:
        - "spring.datasource.hikari.minimum-idle|<=|spring.datasource.hikari.maximum-pool-size"

  ai:
    enabled: false  # Disable AI features for API service (enable only when needed)
  security:
    jwt:
      secret: ${JWT_SECRET:jih_dev_placeholder_jwt_secret_min_32_chars_only_for_explicit_lifecycle_toggle}
      allow-placeholder-secret: ${JIH_ALLOW_PLACEHOLDER_SECRETS:false}
      access-token-expiry: ${JWT_ACCESS_EXPIRY:900000}   # 15 minutes
      refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000} # 7 days
    initial-admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:}
      email: ${ADMIN_EMAIL:admin@javainfohunter.local}
  api:
    cors:
      enabled: true
      allowed-origins:
        - "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - HEAD
        - PATCH
      allowed-headers:
        - "*"
      allow-credentials: false
      max-age: 3600
