services:
  # RabbitMQ 3 with Management UI
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-javainfohunter
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-25672}:5672"   # AMQP port
      - "${RABBITMQ_MGMT_PORT:-25673}:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - javainfohunter-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Redis 7 with persistence
  redis:
    image: redis:7-alpine
    container_name: javainfohunter-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-admin6866!@#}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - javainfohunter-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-admin6866!@#}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  javainfohunter-network:
    driver: bridge
    name: javainfohunter-network

volumes:
  rabbitmq_data:
    name: javainfohunter-rabbitmq-data
  redis_data:
    name: javainfohunter-redis-data
