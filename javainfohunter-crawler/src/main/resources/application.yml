spring:
  application:
    name: javainfohunter-crawler

  # Exclude PgVectorStore auto-config (crawler doesn't use vector store)
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  # Profile Management
  profiles:
    group:
      dev:
        - "dev"
      develop:
        - "develop"
        - "database"

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:javainfohunter}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Flyway Configuration
  flyway:
    enabled: ${CRAWLER_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:25672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 3
        max-concurrency: 10
    connection-timeout: 15000
    cache:
      channel:
        size: 25
      connection:
        mode: channel
  # Spring AI DashScope Configuration
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        enabled: ${AI_CHAT_ENABLED:true}
        options:
          model: qwen3.5-plus
          temperature: 0.7
      # HTTP Client Configuration
      client:
        connect-timeout: 60s
        read-timeout: 300s
        write-timeout: 60s

server:
  port: 8081

# Crawler Module Configuration
javainfohunter:
  # AI service is NOT needed for crawler module
  ai:
    enabled: false

  crawler:
    # Enable/disable crawler
    enabled: ${CRAWLER_ENABLED:true}
    # API key for securing trigger endpoints (empty = no auth required)
    api-key: ${CRAWLER_API_KEY:}

    # Scheduler Configuration
    scheduler:
      enabled: ${CRAWLER_SCHEDULER_ENABLED:true}
      initial-delay: ${CRAWLER_INITIAL_DELAY:30000} # 30 seconds
      fixed-rate: ${CRAWLER_FIXED_RATE:3600000} # 1 hour
      max-concurrent-sources: ${CRAWLER_MAX_CONCURRENT_SOURCES:8}

    # Feed Processing Configuration
    feed:
      max-articles-per-feed: ${MAX_ARTICLES_PER_FEED:100}
      connection-timeout: ${FEED_CONNECTION_TIMEOUT:30000} # 30 seconds
      read-timeout: ${FEED_READ_TIMEOUT:60000} # 60 seconds
      user-agent: ${FEED_USER_AGENT:JavaInfoHunter/1.0}

    # Content Processing
    processing:
      batch-size: ${CRAWLER_BATCH_SIZE:50}
      max-retries: ${CRAWLER_MAX_RETRIES:3}
      retry-backoff: ${CRAWLER_RETRY_BACKOFF:60000} # 1 minute

    # Deduplication
    deduplication:
      enabled: ${DEDUPLICATION_ENABLED:true}
      hash-algorithm: ${HASH_ALGORITHM:SHA-256}

  startup:
    validation:
      enabled: ${STARTUP_VALIDATION_ENABLED:true}
      required-properties:
        - spring.datasource.username
        - spring.datasource.password
        - spring.rabbitmq.host
        - spring.rabbitmq.port
        - spring.rabbitmq.username
        - spring.rabbitmq.password
      numeric-ranges:
        - "spring.datasource.hikari.maximum-pool-size|1|64"
        - "spring.datasource.hikari.minimum-idle|0|32"
        - "spring.rabbitmq.listener.simple.concurrency|1|32"
        - "spring.rabbitmq.listener.simple.max-concurrency|1|32"
        - "spring.rabbitmq.listener.simple.prefetch|1|200"
        - "javainfohunter.crawler.scheduler.max-concurrent-sources|1|32"
      compare-rules:
        - "spring.datasource.hikari.minimum-idle|<=|spring.datasource.hikari.maximum-pool-size"
        - "spring.rabbitmq.listener.simple.concurrency|<=|spring.rabbitmq.listener.simple.max-concurrency"

# Logging Configuration
logging:
  level:
    root: INFO
    com.ron.javainfohunter: DEBUG
    org.springframework.amqp: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: true
    db:
      enabled: true
