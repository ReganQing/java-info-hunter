spring:
  # Database Configuration for Development
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:javainfohunter}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA Configuration for Development
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # RabbitMQ Configuration for Development
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:25672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: ${RABBITMQ_VHOST:/}

javainfohunter:
  processor:
    processing:
      api-concurrency-limit: ${PROCESSING_API_CONCURRENCY_LIMIT:3}
      max-queue-size: ${PROCESSING_MAX_QUEUE_SIZE:200}
    queue:
      concurrency: ${PROCESSOR_RABBITMQ_CONCURRENCY:1}
      max-concurrency: ${PROCESSOR_RABBITMQ_MAX_CONCURRENCY:2}
      prefetch: ${PROCESSOR_RABBITMQ_PREFETCH:2}

# Logging Configuration for Development
logging:
  level:
    root: INFO
    com.ron.javainfohunter: DEBUG
    org.springframework.amqp: DEBUG
    org.springframework.amqp.rabbit.connection: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
