# Docker Compose for Local E2E Testing
# Usage: docker compose -f docker-compose.test.yml up -d
# Cleanup: docker compose -f docker-compose.test.yml down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: javainfohunter-test-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-javainfohunter_test}
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-admin} -d ${DB_NAME:-javainfohunter_test}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - javainfohunter-test-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: javainfohunter-test-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-25672}:5672"
      - "${RABBITMQ_MGMT_PORT:-25673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - rabbitmq_test_data:/var/lib/rabbitmq
    networks:
      - javainfohunter-test-network

  redis:
    image: redis:7-alpine
    container_name: javainfohunter-test-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-admin6866!@#}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-admin6866!@#}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - redis_test_data:/data
    networks:
      - javainfohunter-test-network

volumes:
  postgres_test_data:
    driver: local
  rabbitmq_test_data:
    driver: local
  redis_test_data:
    driver: local

networks:
  javainfohunter-test-network:
    driver: bridge
